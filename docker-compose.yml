services:

  postgres:
    image: pgvector/pgvector:pg17

    container_name: barcodeidentify-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: barcodeidentify
      POSTGRES_USER: barcodeidentify
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: